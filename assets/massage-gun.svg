<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Compact massage gun illustration">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf6fd"/><stop offset="1" stop-color="#8ccbec"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1d3b1"/><stop offset="1" stop-color="#d9a774"/></linearGradient>
    <radialGradient id="sh2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1d4e6e" stop-opacity=".22"/><stop offset="1" stop-color="#1d4e6e" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="205" cy="262" rx="110" ry="14" fill="url(#sh2)"/>
  <!-- handle -->
  <rect x="178" y="118" width="54" height="138" rx="22" fill="url(#bd)" stroke="#4f9bc9" stroke-width="3"/>
  <g stroke="#4f9bc9" stroke-width="2" opacity=".5"><line x1="190" y1="176" x2="220" y2="176"/><line x1="190" y1="190" x2="220" y2="190"/><line x1="190" y1="204" x2="220" y2="204"/></g>
  <!-- body -->
  <rect x="120" y="60" width="190" height="72" rx="36" fill="url(#bd)" stroke="#4f9bc9" stroke-width="3"/>
  <circle cx="272" cy="96" r="15" fill="#fff" stroke="#4f9bc9" stroke-width="2.5"/>
  <circle cx="272" cy="96" r="5" fill="#e3b98a"/>
  <!-- shaft + head -->
  <rect x="92" y="86" width="32" height="20" rx="4" fill="#4f9bc9"/>
  <circle cx="78" cy="96" r="26" fill="url(#hd)" stroke="#b9875a" stroke-width="2.5"/>
  <!-- motion lines -->
  <g stroke="#9fd3ee" stroke-width="3" stroke-linecap="round"><path d="M38 76 C30 88 30 104 38 116"/><path d="M26 66 C14 84 14 108 26 126"/></g>
</svg>
